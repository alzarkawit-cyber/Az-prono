<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ PRONO VIP</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; text-align: center; padding: 15px; }
        .container { max-width: 400px; margin: auto; }
        .pay-box { background: #1e272e; border-radius: 12px; padding: 20px; border: 2px solid #f1c40f; margin-bottom: 20px; }
        select, input { width: 95%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; background: #fff; }
        .btn-send { background: #25D366; color: white; padding: 15px; border-radius: 8px; border: none; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .price-tag { color: #f1c40f; font-size: 26px; font-weight: bold; margin: 10px 0; display: block; }
        .net { font-size: 14px; margin: 5px 0; padding: 8px; border-radius: 5px; font-weight: bold; }
        .mtn { background: #ffcc00; color: black; }
        .celtiis { background: #ff0000; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color:#f1c40f;">🏆 AZ PRONO - VIP</h1>
        
        <div class="pay-box">
            <p>1️⃣ CHOISISSEZ VOTRE COTE :</p>
            <select id="cote_select" onchange="updatePrice()">
                <option value="2" data-prix="50">Cote 2 (Ticket Safe) - 50 FCFA</option>
                <option value="5" data-prix="100">Cote 5 (Gros Gain) - 100 FCFA</option>
            </select>

            <span class="price-tag" id="display_price">PRIX : 50 FCFA</span>

            <p>2️⃣ PAYEZ SUR :</p>
            <div class="net mtn">🟡 MTN : +229 0151249201</div>
            <div class="net celtiis">🔴 CELTIIS : +229 0192045713</div>
            
            <hr style="margin: 20px 0; border: 0.5px solid #444;">
            
            <p>3️⃣ VOS INFOS :</p>
            <input type="text" id="nom" placeholder="Votre Nom et Prénom">
            <input type="text" id="num_pay" placeholder="Numéro utilisé pour le dépôt">
            
            <button class="btn-send" onclick="envoyerWhatsApp()">✅ RECEVOIR MON CODE SUR WHATSAPP</button>
        </div>
    </div>

    <script>
        function updatePrice() {
            var select = document.getElementById('cote_select');
            var prix = select.options[select.selectedIndex].getAttribute('data-prix');
            document.getElementById('display_price').innerText = "PRIX : " + prix + " FCFA";
        }

        function envoyerWhatsApp() {
            var nom = document.getElementById('nom').value;
            var num = document.getElementById('num_pay').value;
            var cote = document.getElementById('cote_select').value;
            var prix = document.getElementById('cote_select').options[document.getElementById('cote_select').selectedIndex].getAttribute('data-prix');
            
            if(nom == "" || num == "") {
                alert("Veuillez remplir votre nom et le numéro de dépôt !");
                return;
            }

            var message = "Salut AZ PRONO !\n\n" +
                          "💰 J'ai payé " + prix + " FCFA\n" +
                          "🎯 Pour la COTE : " + cote + "\n" +
                          "👤 Nom : " + nom + "\n" +
                          "📱 N° Dépôt : " + num;
            
            // Redirection vers ton numéro MTN
            var url = "https://wa.me/2290151249201?text=" + encodeURIComponent(message);
            window.location.href = url;
        }
    </script>
</body>
</html>
